<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Scraper & Sales Pipeline Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --primary-light: #EFF6FF;
            --primary-border: #BFDBFE;
            --bg-body: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 16px;
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 32px;
            }
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon-badge {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.4px;
            line-height: 1.2;
        }

        header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Dashboard Top Layout */
        .top-dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 24px;
            align-items: start;
        }

        @media (min-width: 1024px) {
            .top-dashboard-grid {
                grid-template-columns: 1.35fr 1fr;
            }
        }

        /* Cards Base */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }

        /* Adaptive Input Grid */
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
            outline: none;
            background: #FFFFFF;
            transition: var(--transition);
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #94A3B8;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input[type="text"]:disabled {
            background-color: #F1F5F9;
            color: #94A3B8;
            cursor: not-allowed;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            height: 38px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .search-action-row {
            margin-top: 14px;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            width: 100%;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
        }

        button.btn-primary:disabled {
            background: #94A3B8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #F1F5F9;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: #334155;
            display: none;
            font-family: 'ui-monospace', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            line-height: 1.4;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .metric-card {
            background: var(--card-bg);
            padding: 16px 18px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .metric-card:hover {
            border-color: #CBD5E1;
            box-shadow: var(--shadow-md);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background: var(--border-color);
        }

        .metric-card:nth-child(1)::before {
            background: var(--primary);
        }

        .metric-card:nth-child(2)::before {
            background: var(--success);
        }

        .metric-card:nth-child(3)::before {
            background: var(--warning);
        }

        .metric-card:nth-child(4)::before {
            background: #8B5CF6;
        }

        .metric-card span {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .search-filter {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .search-filter {
                width: auto;
            }
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-input-wrapper input {
            padding-left: 36px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Lead Cards List */
        .lead-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .lead-card:hover {
            border-color: #CBD5E1;
            box-shadow: var(--shadow-md);
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .lead-summary-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            flex: 1;
        }

        .lead-title-group h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        .lead-category {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .lead-compact-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12.5px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #334155;
        }

        .actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-toggle-details {
            background: #F1F5F9;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-toggle-details:hover {
            background: #E2E8F0;
        }

        .btn-delete {
            background: #FEF2F2;
            color: var(--danger);
            border: 1px solid #FCA5A5;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-delete:hover {
            background: #FEE2E2;
            color: #991B1B;
        }

        /* Tag Badges */
        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .tag-danger {
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }

        .tag-warning {
            background: #FFFBEB;
            color: #92400E;
            border: 1px solid #FDE68A;
        }

        .tag-success {
            background: #ECFDF5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        /* Expanded Details Section */
        .lead-details {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lead-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
            background: #F8FAFC;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .lead-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: var(--text-dark);
            font-size: 12.5px;
            font-weight: 600;
            word-break: break-all;
        }

        /* Audit Box */
        .audit-box {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-left: 4px solid #64748B;
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .audit-box h4 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .audit-issues {
            list-style-type: none;
            font-size: 12px;
            color: #334155;
            margin-bottom: 10px;
        }

        .audit-issues li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .audit-issues li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--primary);
            font-weight: bold;
        }

        .services-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .service-pill {
            background: #EEF2FF;
            color: #3730A3;
            border: 1px solid #C7D2FE;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* Pitch Box */
        .pitch-box {
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .pitch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pitch-header h4 {
            font-size: 12px;
            font-weight: 700;
            color: #1E40AF;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy {
            background: #FFFFFF;
            color: #1E40AF;
            border: 1px solid #93C5FD;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-copy:hover {
            background: #DBEAFE;
            color: #1D4ED8;
        }

        .pitch-text {
            font-size: 12.5px;
            white-space: pre-wrap;
            color: #1E293B;
            line-height: 1.5;
            font-family: inherit;
        }

        /* Card Bottom Actions */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-wa {
            background: #10B981;
            color: white;
            box-shadow: 0 1px 2px rgba(16, 185, 129, 0.2);
        }

        .btn-wa:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-mail {
            background: var(--primary);
            color: white;
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
        }

        .btn-mail:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .status-select {
            height: 34px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            background-color: #F8FAFC;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-title-group">
            <div class="header-icon-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <div>
                <h1>Lead Finder & Sales Pipeline Dashboard</h1>
                <p>Automated Google Maps Scraper, Website Auditor & Multi-Point Outreach Engine</p>
            </div>
        </div>
    </header>

    <!-- Side-by-Side Compact Dashboard Grid -->
    <div class="top-dashboard-grid">
        <!-- Compact Search Card -->
        <div class="card">
            <div class="card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Launch Business Search & Website Audit
            </div>
            <div class="search-grid">
                <div class="form-group">
                    <label>Business Type</label>
                    <input type="text" id="businessType" placeholder="e.g. Dentists">
                </div>
                <div class="form-group">
                    <label>Target Area</label>
                    <input type="text" id="location" placeholder="e.g. Austin, TX">
                </div>
                <div class="form-group">
                    <label>Max Leads</label>
                    <input type="number" id="maxResults" value="10" min="1" max="50">
                </div>
                <div class="form-group">
                    <div class="checkbox-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isNearMe" onchange="toggleLocationInput()"> Near Me
                        </label>
                    </div>
                </div>
            </div>
            <div class="search-action-row">
                <button class="btn-primary" id="btnScrape" onclick="startScrape()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>Start Search</span>
                </button>
            </div>
            <div class="progress-box" id="progressBox">Ready...</div>
        </div>

        <!-- Compact Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span>Total Leads</span>
                <h2 id="metricTotal">0</h2>
            </div>
            <div class="metric-card">
                <span>Contacted</span>
                <h2 id="metricContacted">0</h2>
            </div>
            <div class="metric-card">
                <span>Audits Needed</span>
                <h2 id="metricOpportunities">0</h2>
            </div>
            <div class="metric-card">
                <span>Conversion Rate</span>
                <h2 id="metricConversion">0%</h2>
            </div>
        </div>
    </div>

    <!-- Pipeline Search & Controls Bar -->
    <div class="controls-bar">
        <div class="search-filter">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="filterSearch" placeholder="Search leads by name or category..."
                    oninput="renderLeads()">
            </div>
            <select id="filterStatus" class="status-select" onchange="renderLeads()">
                <option value="All">All Statuses</option>
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>
        </div>
    </div>

    <!-- Lead Cards List Container -->
    <div id="leadsList"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let globalLeads = [];

        function toggleLocationInput() {
            const isNearMe = document.getElementById('isNearMe').checked;
            const locInput = document.getElementById('location');
            locInput.disabled = isNearMe;
            if (isNearMe) locInput.value = '';
        }

        async function loadLeads() {
            try {
                const res = await fetch('/api/leads');
                globalLeads = await res.json();
                updateMetrics();
                renderLeads();
            } catch (err) {
                console.error('Failed to load leads:', err);
            }
        }

        function updateMetrics() {
            const total = globalLeads.length;
            const contacted = globalLeads.filter(l => l.status === 'Contacted').length;
            const opportunities = globalLeads.filter(l => l.siteStatus && l.siteStatus !== 'Active Site').length;
            const conversion = total > 0 ? ((contacted / total) * 100).toFixed(1) : 0;

            document.getElementById('metricTotal').innerText = total;
            document.getElementById('metricContacted').innerText = contacted;
            document.getElementById('metricOpportunities').innerText = opportunities;
            document.getElementById('metricConversion').innerText = `${conversion}%`;
        }

        function toggleLeadDetails(id) {
            const detailsEl = document.getElementById(`details_${id}`);
            const btnEl = document.getElementById(`toggle_btn_${id}`);
            if (!detailsEl || !btnEl) return;

            if (detailsEl.style.display === 'none' || !detailsEl.style.display) {
                detailsEl.style.display = 'block';
                btnEl.innerHTML = 'Less Details ▲';
            } else {
                detailsEl.style.display = 'none';
                btnEl.innerHTML = 'More Details ▾';
            }
        }

        function renderLeads() {
            const container = document.getElementById('leadsList');
            const searchQuery = document.getElementById('filterSearch').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            const filtered = globalLeads.filter(l => {
                const matchesSearch = (l.shopName || '').toLowerCase().includes(searchQuery) ||
                    (l.category || '').toLowerCase().includes(searchQuery);
                const matchesStatus = statusFilter === 'All' || l.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align:center; color:var(--text-muted); padding:40px 20px;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px;">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p style="font-size:14px; font-weight:600; color:var(--text-dark);">No leads found</p>
                        <p style="font-size:12px; margin-top:4px;">Launch a search above to discover new opportunities!</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(lead => {
                const issues = lead.issues ? lead.issues.split(' | ') : [];
                const services = lead.services ? lead.services.split('; ') : [];

                let badgeClass = 'tag-warning';
                if (lead.siteStatus === 'Missing Website' || lead.siteStatus === 'Inaccessible / Down') badgeClass = 'tag-danger';
                if (lead.siteStatus === 'Active Site') badgeClass = 'tag-success';

                return `
                <div class="lead-card" id="card_${lead.id}">
                    <!-- Compact Bar Header -->
                    <div class="lead-header">
                        <div class="lead-summary-info">
                            <div class="lead-title-group">
                                <h3>${escapeHtml(lead.shopName)}</h3>
                                <div class="lead-category">${escapeHtml(lead.category)} • ⭐ ${lead.rating || 'N/A'} (${lead.reviews || 0} reviews)</div>
                            </div>
                            <div class="lead-compact-meta">
                                <span class="meta-item">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                    ${escapeHtml(lead.phone || 'N/A')}
                                </span>
                            </div>
                        </div>

                        <div class="actions-right">
                            <span class="tag-badge ${badgeClass}">${escapeHtml(lead.siteStatus || 'Missing')}</span>
                            <button class="btn-toggle-details" id="toggle_btn_${lead.id}" onclick="toggleLeadDetails('${lead.id}')">
                                More Details ▾
                            </button>
                            <button class="btn-delete" onclick="deleteLead('${lead.id}')" title="Delete Lead">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Collapsible Full Details -->
                    <div class="lead-details" id="details_${lead.id}">
                        <div class="lead-grid">
                            <div class="info-item">
                                <span class="info-label">Phone</span>
                                <span class="info-value">${escapeHtml(lead.phone || 'Not Found')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Email</span>
                                <span class="info-value">${escapeHtml(lead.email || 'Not Found')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Website</span>
                                <span class="info-value">${lead.website && lead.website !== 'None' ? `<a href="${escapeHtml(lead.website)}" target="_blank" style="color:var(--primary); text-decoration:underline;">${escapeHtml(lead.website)}</a>` : 'None'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Tech Stack</span>
                                <span class="info-value">${escapeHtml(lead.techStack || 'Unknown')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Address</span>
                                <span class="info-value">${escapeHtml(lead.address || 'Not Found')}</span>
                            </div>
                        </div>

                        <!-- Audit Findings -->
                        <div class="audit-box">
                            <h4>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                                Audit Findings & Recommended Offer
                            </h4>
                            <ul class="audit-issues">
                                ${issues.map(iss => `<li>${escapeHtml(iss)}</li>`).join('')}
                            </ul>
                            <div class="services-pills">
                                ${services.map(srv => `<span class="service-pill">${escapeHtml(srv)}</span>`).join('')}
                            </div>
                        </div>

                        <!-- Pitch Script -->
                        <div class="pitch-box">
                            <div class="pitch-header">
                                <h4>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                    Tailored Pitch Script
                                </h4>
                                <button class="btn-copy" onclick="copyPitch('${lead.id}')">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    Copy Script
                                </button>
                            </div>
                            <div class="pitch-text" id="pitch_${lead.id}">${escapeHtml(lead.pitch || 'No pitch available.')}</div>
                        </div>

                        <div class="card-actions">
                            <div class="action-btns">
                                ${lead.phone && lead.phone !== 'Not Found' ? `
                                    <a href="https://wa.me/${lead.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(lead.pitch || '')}" target="_blank" class="btn-action btn-wa">
                                        WhatsApp Outreach
                                    </a>` : ''}
                                ${lead.email && lead.email !== 'Not Found' ? `
                                    <a href="mailto:${lead.email}?subject=${encodeURIComponent('Quick question regarding ' + lead.shopName)}&body=${encodeURIComponent(lead.pitch || '')}" target="_blank" class="btn-action btn-mail">
                                        Email Pitch
                                    </a>` : ''}
                            </div>
                            <div>
                                <select class="status-select" onchange="updateLeadStatus('${lead.id}', this.value)">
                                    <option value="New" ${lead.status === 'New' ? 'selected' : ''}>Status: New</option>
                                    <option value="Contacted" ${lead.status === 'Contacted' ? 'selected' : ''}>Status: Contacted</option>
                                    <option value="In Progress" ${lead.status === 'In Progress' ? 'selected' : ''}>Status: In Progress</option>
                                    <option value="Closed" ${lead.status === 'Closed' ? 'selected' : ''}>Status: Closed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function updateLeadStatus(id, newStatus) {
            try {
                await fetch('/api/leads/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status: newStatus })
                });
                const target = globalLeads.find(l => String(l.id) === String(id));
                if (target) target.status = newStatus;
                updateMetrics();
            } catch (err) {
                alert('Failed to update status.');
            }
        }

        async function deleteLead(id) {
            if (!confirm('Are you sure you want to delete this lead?')) return;

            try {
                const res = await fetch(`/api/leads/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    globalLeads = globalLeads.filter(l => String(l.id) !== String(id));
                    updateMetrics();
                    renderLeads();
                } else {
                    alert('Could not delete lead.');
                }
            } catch (err) {
                alert('Error deleting lead.');
            }
        }

        function copyPitch(id) {
            const pitchEl = document.getElementById(`pitch_${id}`);
            if (pitchEl) {
                navigator.clipboard.writeText(pitchEl.innerText);
                alert('Pitch script copied to clipboard!');
            }
        }

        function startScrape() {
            const businessType = document.getElementById('businessType').value.trim();
            const location = document.getElementById('location').value.trim();
            const isNearMe = document.getElementById('isNearMe').checked;
            const maxResults = document.getElementById('maxResults').value;

            if (!businessType || (!isNearMe && !location)) {
                alert('Please enter a business type and location (or check "Near Me").');
                return;
            }

            const btn = document.getElementById('btnScrape');
            const pBox = document.getElementById('progressBox');
            btn.disabled = true;
            pBox.style.display = 'block';
            pBox.innerText = 'Initializing scraper session...';

            if (isNearMe && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        socket.emit('start-scrape', {
                            businessType, location, maxResults, isNearMe: true,
                            coords: { latitude: pos.coords.latitude, longitude: pos.coords.longitude }
                        });
                    },
                    () => {
                        socket.emit('start-scrape', { businessType, location, maxResults, isNearMe: false });
                    }
                );
            } else {
                socket.emit('start-scrape', { businessType, location, maxResults, isNearMe });
            }
        }

        socket.on('progress', (msg) => {
            const pBox = document.getElementById('progressBox');
            pBox.innerText = msg;
        });

        socket.on('scrape-complete', (updatedLeads) => {
            globalLeads = updatedLeads;
            updateMetrics();
            renderLeads();

            document.getElementById('btnScrape').disabled = false;
            document.getElementById('progressBox').innerText = 'Scrape completed successfully!';
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        loadLeads();
    </script>
</body>

</html>
