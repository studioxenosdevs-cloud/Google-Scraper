<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Finder & Pipeline Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2B68F6;
            --primary-hover: #1E51D3;
            --bg-surface: #F4F7FC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-surface);
            color: var(--text-main);
            padding: 16px;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px;
            }
        }

        header {
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .metrics-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .metric-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .metric-card span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 20px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            align-items: center;
        }

        @media (min-width: 640px) {
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 1024px) {
            .search-grid {
                grid-template-columns: 1.5fr 1.5fr 110px 100px 120px;
            }
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: white;
        }

        input[type="text"]:disabled {
            background: #F1F5F9;
            cursor: not-allowed;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        button.btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        button.btn-action {
            background: #EEF2FF;
            color: var(--primary);
            border: 1px solid #C7D2FE;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        button.btn-action:hover:not(:disabled) {
            background: #E0E7FF;
        }

        button.btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
            background: #F1F5F9;
        }

        .status-log {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: #EFF6FF;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
        }

        .directory-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 640px) {
            .directory-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .category-group {
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: white;
            overflow: hidden;
        }

        .category-header {
            background: #F8FAFC;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lead-accordion {
            display: flex;
            flex-direction: column;
        }

        .lead-card {
            background: white;
            border-bottom: 1px solid var(--border-color);
        }

        .lead-card:last-child {
            border-bottom: none;
        }

        .lead-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
        }

        @media (min-width: 768px) {
            .lead-header {
                display: grid;
                grid-template-columns: 2fr 1.2fr 1fr 1.5fr 1fr 24px;
                align-items: center;
                gap: 12px;
            }
        }

        .shop-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        .shop-cat {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lead-drawer {
            display: none;
            padding: 16px;
            background: #FAFCFF;
            border-top: 1px solid var(--border-color);
        }

        .lead-card.open .lead-drawer {
            display: block;
        }

        .lead-card.open .chevron-icon {
            transform: rotate(180deg);
        }

        .drawer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .drawer-item label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .drawer-item span {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-main);
            word-break: break-all;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            width: fit-content;
        }

        .badge-missing {
            background: #FEE2E2;
            color: #991B1B;
        }

        .badge-outdated {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-modern {
            background: #D1FAE5;
            color: #065F46;
        }

        .chevron-icon {
            transition: transform 0.2s ease;
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .btn-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .drawer-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        @media (min-width: 640px) {
            .drawer-footer {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Lead Finder & Pipeline CRM</h1>
        <p>Google Maps Deep Scraper & CSV Lead Pipeline Engine</p>
    </header>

    <div class="dashboard-grid">
        <div class="card" style="margin-bottom:0;">
            <div class="search-grid">
                <input type="text" id="businessType" placeholder="Business Keyword (e.g. Dentists)" />
                <input type="text" id="location" placeholder="City or Region (e.g. Miami)" />
                <label class="checkbox-label">
                    <input type="checkbox" id="nearMe" onchange="toggleNearMe(this)" /> Near Me
                </label>
                <select id="maxResults">
                    <option value="10">10 Leads</option>
                    <option value="25" selected>25 Leads</option>
                    <option value="50">50 Leads</option>
                </select>
                <button class="btn-primary" onclick="startScrape()">Run Scraper</button>
            </div>
            <div id="status-log" class="status-log" style="display: none;"></div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card"><span>Saved Leads</span>
                <h2 id="metric-total">0</h2>
            </div>
            <div class="metric-card"><span>No Website</span>
                <h2 id="metric-missing" style="color: var(--danger);">0</h2>
            </div>
            <div class="metric-card"><span>Outdated</span>
                <h2 id="metric-outdated" style="color: var(--warning);">0</h2>
            </div>
            <div class="metric-card"><span>Closed</span>
                <h2 id="metric-closed" style="color: var(--success);">0</h2>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="directory-header">
            <h2>Leads Directory (CSV Backed)</h2>
            <div style="display:flex; gap: 12px; align-items:center; flex-wrap: wrap;">
                <label class="checkbox-label">
                    <input type="checkbox" id="groupByCat" onchange="applyFilters()"> Group Category
                </label>
                <select id="filterStatus" style="width: 150px;" onchange="applyFilters()">
                    <option value="ALL">All Statuses</option>
                    <option value="New">New</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Closed">Closed</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
        </div>

        <div id="lead-container"></div>
    </div>

    <!-- Modal -->
    <div id="outreachModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" style="font-size:16px; margin-bottom:12px;">Draft Message</h3>
            <div style="margin-bottom: 10px;">
                <label
                    style="font-size: 10px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Recipient</label>
                <input type="text" id="modalTarget" readonly style="background:#F1F5F9; margin-top:4px;" />
            </div>
            <div style="margin-bottom: 14px;">
                <label
                    style="font-size: 10px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Pitch</label>
                <textarea id="modalMsg" rows="5" style="margin-top:4px;"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-action" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" style="width:auto;" onclick="sendOutreach()">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let globalLeads = [];
        let currentOutreach = { type: '', leadId: null };
        let userCoords = null;

        const svgIcons = {
            star: `<svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
            phone: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
            chevron: `<svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>`,
            whatsapp: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>`,
            mail: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`
        };

        function toggleNearMe(cb) {
            const locInput = document.getElementById('location');
            locInput.disabled = cb.checked;
            if (cb.checked) {
                locInput.value = '';
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            userCoords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                        },
                        (err) => console.warn('Geolocation denied/failed:', err)
                    );
                }
            } else {
                userCoords = null;
            }
        }

        socket.on('progress', msg => {
            const log = document.getElementById('status-log');
            log.style.display = 'inline-block';
            log.innerText = `Status: ${msg}`;
        });

        socket.on('scrape-complete', leads => {
            document.getElementById('status-log').innerText = 'Scrape complete!';
            globalLeads = leads;
            applyFilters();
        });

        function startScrape() {
            const businessType = document.getElementById('businessType').value.trim();
            const location = document.getElementById('location').value.trim();
            const isNearMe = document.getElementById('nearMe').checked;
            const maxResults = parseInt(document.getElementById('maxResults').value, 10);

            if (!businessType) return alert('Please enter a business keyword');
            if (!isNearMe && !location) return alert('Please enter a city or check "Near Me"');

            socket.emit('start-scrape', { businessType, location, maxResults, isNearMe, coords: userCoords });
        }

        async function loadLeads() {
            try {
                const res = await fetch('/api/leads');
                globalLeads = await res.json();
                applyFilters();
            } catch (err) {
                console.error('Failed to load leads from API', err);
            }
        }

        function updateMetrics(leads) {
            document.getElementById('metric-total').innerText = leads.length;
            document.getElementById('metric-missing').innerText = leads.filter(l => l.siteStatus === 'Missing').length;
            document.getElementById('metric-outdated').innerText = leads.filter(l => (l.siteStatus || '').includes('Outdated')).length;
            document.getElementById('metric-closed').innerText = leads.filter(l => l.status === 'Closed').length;
        }

        function toggleCard(cardId, e) {
            if (['SELECT', 'A', 'BUTTON', 'INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
            const card = document.getElementById(`card-${cardId}`);
            if (card) card.classList.toggle('open');
        }

        function applyFilters() {
            const statusFilter = document.getElementById('filterStatus').value;
            let filtered = globalLeads;
            if (statusFilter !== 'ALL') {
                filtered = filtered.filter(l => String(l.status) === statusFilter);
            }
            renderLeads(filtered);
        }

        function renderLeads(leads) {
            updateMetrics(globalLeads);
            const container = document.getElementById('lead-container');
            container.innerHTML = '';

            const stackCategory = document.getElementById('groupByCat').checked;

            if (stackCategory) {
                const grouped = leads.reduce((acc, lead) => {
                    const cat = lead.category || 'General Business';
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(lead);
                    return acc;
                }, {});

                for (const [category, items] of Object.entries(grouped)) {
                    const catGroup = document.createElement('div');
                    catGroup.className = 'category-group';
                    catGroup.innerHTML = `
                        <div class="category-header">
                          <span>${category}</span>
                          <span class="badge badge-modern">${items.length} Leads</span>
                        </div>
                        <div class="lead-accordion"></div>
                    `;
                    container.appendChild(catGroup);
                    const groupList = catGroup.querySelector('.lead-accordion');
                    items.forEach(lead => groupList.appendChild(createLeadCard(lead)));
                }
            } else {
                const accordion = document.createElement('div');
                accordion.className = 'lead-accordion';
                leads.forEach(lead => accordion.appendChild(createLeadCard(lead)));
                container.appendChild(accordion);
            }
        }

        function createLeadCard(lead) {
            let badgeClass = 'badge-modern';
            if (lead.siteStatus === 'Missing') badgeClass = 'badge-missing';
            if ((lead.siteStatus || '').includes('Outdated')) badgeClass = 'badge-outdated';

            const displayName = lead.shopName || 'Business Listing';
            const hasEmail = lead.email && lead.email !== 'Not Found';
            const hasPhone = lead.phone && lead.phone !== 'Not Found';
            const dateStr = lead.dateAdded ? lead.dateAdded.split(' ')[0] : 'N/A';

            const card = document.createElement('div');
            card.className = 'lead-card';
            card.id = `card-${lead.id}`;

            card.innerHTML = `
        <div class="lead-header" onclick="toggleCard('${lead.id}', event)">
          <div>
            <div class="shop-title">${displayName}</div>
            <div class="shop-cat">${lead.category} • ${svgIcons.star} ${lead.rating} (${lead.reviews || 0})</div>
          </div>
          <div style="font-size:12px; display:flex; align-items:center; gap:4px;">${svgIcons.phone} ${lead.phone}</div>
          <div><span class="badge ${badgeClass}">${lead.siteStatus}</span></div>
          <div style="font-size:12px;">📅 <strong>${dateStr}</strong></div>
          <div>
            <select onchange="updateLead('${lead.id}', this.value)">
              <option value="New" ${lead.status === 'New' ? 'selected' : ''}>New</option>
              <option value="Contacted" ${lead.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
              <option value="Closed" ${lead.status === 'Closed' ? 'selected' : ''}>Closed</option>
              <option value="Rejected" ${lead.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </div>
          <div style="display:flex; justify-content:flex-end;">${svgIcons.chevron}</div>
        </div>
        
        <div class="lead-drawer">
          <div class="drawer-grid">
            <div class="drawer-item"><label>Date Generated</label><span>${lead.dateAdded || 'N/A'}</span></div>
            <div class="drawer-item"><label>Owner / Manager</label><span>${lead.ownerName || 'Not Listed'}</span></div>
            <div class="drawer-item"><label>Email Address</label><span>${lead.email || 'Not Found'}</span></div>
            <div class="drawer-item"><label>Full Address</label><span>${lead.address || 'N/A'}</span></div>
            <div class="drawer-item"><label>Tech Stack</label><span>${lead.techStack || 'Custom'}</span></div>
          </div>
          <div class="drawer-footer">
            <div style="display:flex; gap:12px;">
              ${lead.website && lead.website !== 'None' ? `<a href="${lead.website}" class="btn-link" target="_blank">Website</a>` : '<span style="color:#94A3B8; font-size:12px;">No Website</span>'}
              <a href="${lead.mapsUrl}" class="btn-link" target="_blank">Google Maps Profile</a>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn-action" ${!hasPhone ? 'disabled' : ''} onclick="openOutreach('whatsapp', '${lead.id}')">${svgIcons.whatsapp} WhatsApp</button>
              <button class="btn-action" ${!hasEmail ? 'disabled' : ''} onclick="openOutreach('gmail', '${lead.id}')">${svgIcons.mail} Email</button>
            </div>
          </div>
        </div>
    `;
            return card;
        }

        function openOutreach(type, leadId) {
            const lead = globalLeads.find(l => String(l.id) === String(leadId));
            if (!lead) return;

            currentOutreach = { type, leadId: lead.id };
            const modal = document.getElementById('outreachModal');

            if (type === 'whatsapp') {
                const cleanPhone = (lead.phone || '').replace(/[^0-9]/g, '');
                document.getElementById('modalTitle').innerText = 'Craft WhatsApp Message';
                document.getElementById('modalTarget').value = cleanPhone ? `+${cleanPhone}` : 'No phone';
                document.getElementById('modalMsg').value = `Hi ${lead.shopName},\n\nI came across your listing on Google Maps. We build custom websites and lead integration pipelines for ${lead.category} businesses.\n\nWould you be open to a quick overview for ${lead.shopName}?`;
            } else {
                document.getElementById('modalTitle').innerText = 'Craft Email Message';
                document.getElementById('modalTarget').value = lead.email;
                document.getElementById('modalMsg').value = `Hi ${lead.ownerName && lead.ownerName !== 'Not Listed' ? lead.ownerName : 'Team'},\n\nI was reviewing your business profile (${lead.shopName}) on Google Maps and noticed an opportunity to enhance your digital lead generation (${lead.opportunity || 'Automation'}).\n\nWe build custom solutions for ${lead.category} providers.\n\nBest regards,\nStudioXenos`;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('outreachModal').classList.remove('active');
        }

        function sendOutreach() {
            const lead = globalLeads.find(l => String(l.id) === String(currentOutreach.leadId));
            const msg = encodeURIComponent(document.getElementById('modalMsg').value);
            const target = document.getElementById('modalTarget').value;

            if (currentOutreach.type === 'whatsapp') {
                const cleanPhone = target.replace(/[^0-9]/g, '');
                window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
            } else {
                window.open(`mailto:${target}?subject=${encodeURIComponent('Inquiry regarding ' + (lead ? lead.shopName : 'Business'))}&body=${msg}`, '_blank');
            }

            if (lead) updateLead(lead.id, 'Contacted');
            closeModal();
        }

        async function updateLead(id, status) {
            await fetch('/api/leads/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });

            const lead = globalLeads.find(l => String(l.id) === String(id));
            if (lead) lead.status = status;
            updateMetrics(globalLeads);
        }

        loadLeads();
    </script>
</body>

</html>
